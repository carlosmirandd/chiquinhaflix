<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChiquinhaFlix</title>
<link rel="icon" href="assets/chiquinha.png">
<link rel="stylesheet" href="style.css?v=202611021749">
</head>
<body>

<!-- Login (só pra dar nome, sem senha) -->
<section id="login" class="login" hidden>
  <a class="brand login-brand"><img src="assets/chiquinha.png" alt="" class="brand-face"><img src="assets/nome.png" alt="ChiquinhaFlix" class="brand-name"></a>
  <form class="login-card" id="loginForm">
    <h1>Entrar</h1>
    <input id="nome" type="text" placeholder="Nome de usuário" maxlength="30" autocomplete="off">
    <button class="btn red" type="submit">Entrar</button>
    <p class="hint">Sem senha e sem servidor: o nome fica salvo só no seu navegador.</p>
  </form>
</section>

<!-- App -->
<div id="app" hidden>
  <header id="hdr">
    <div class="top">
      <a class="brand" id="logo" title="Início"><img src="assets/chiquinha.png" alt="" class="brand-face"><img src="assets/nome.png" alt="ChiquinhaFlix" class="brand-name"></a>
      <nav id="nav">
        <button data-p="home" class="on">Início</button>
        <button data-p="hoje">No ar hoje</button>
        <button data-p="lista">Minha lista</button>
      </nav>
      <div class="right">
        <div class="search" id="search">
          <button id="searchBtn" aria-label="Buscar">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          </button>
          <input id="q" type="search" placeholder="Títulos, gêneros" autocomplete="off">
        </div>
        <button class="sair" id="sair">Sair</button>
      </div>
    </div>
  </header>

  <!-- Início -->
  <section id="home">
    <div class="hero" id="hero" hidden>
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-shade"></div>
      <div class="hero-body">
        <h1 id="heroTitle"></h1>
        <p id="heroMeta" class="dots"></p>
        <p id="heroSin" class="hero-sin"></p>
        <div class="hero-btns">
          <button class="pill white" id="heroPlay"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M6 4l14 8-14 8z" fill="currentColor"/></svg>Assistir</button>
          <button class="pill grey" id="heroInfo">Mais informações</button>
        </div>
      </div>
      <div class="hero-badge" id="heroBadge" hidden></div>
    </div>
    <div id="rows"></div>
  </section>

  <!-- Grade (busca, no ar hoje, minha lista) -->
  <section id="list" class="wrap" hidden>
    <h2 id="listTitle"></h2>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Player -->
  <section id="view" class="wrap" hidden>
    <button class="pill grey small" id="back">← Voltar</button>
    <div class="player" id="player"></div>
    <div class="player-bar">
      <span id="epName"></span>
      <span>
        <button class="pill grey small" id="prev">⏮ Anterior</button>
        <button class="pill grey small" id="next">Próximo ⏭</button>
      </span>
    </div>
    <h1 class="vtitle" id="vTitle"></h1>
    <div class="eps-head"><h2>Episódios</h2><select id="season"></select></div>
    <div class="eps" id="eps"></div>
  </section>

  <div class="center" id="msg"></div>

  <footer>
    <p>Projeto pessoal e educacional, sem fins lucrativos. Não hospeda nem distribui vídeo: o player é um embed de terceiros. Não afiliado a nenhum serviço de streaming.</p>
    <p>Dados de séries via <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener">TVMaze</a> (CC BY-SA).</p>
  </footer>
</div>

<!-- Modal de detalhes -->
<div id="modal" class="modal" hidden>
  <div class="sheet" id="sheet">
    <button class="close" id="mClose" aria-label="Fechar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="m-hero">
      <div class="m-bg" id="mBg"></div>
      <div class="m-shade"></div>
      <div class="m-hero-body">
        <h1 id="mTitle"></h1>
        <div class="m-prog" id="mProg" hidden><i></i><span></span></div>
        <div class="m-btns">
          <button class="pill white sq" id="mPlay"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M6 4l14 8-14 8z" fill="currentColor"/></svg><span id="mPlayTxt">Assistir</span></button>
          <button class="round" id="mFav" title="Minha lista"></button>
        </div>
      </div>
    </div>
    <div class="m-body">
      <div class="m-left">
        <p class="m-meta" id="mMeta"></p>
        <p class="m-cur" id="mCur"></p>
        <p class="m-sin" id="mSin"></p>
      </div>
      <div class="m-right" id="mRight"></div>
    </div>
    <div class="m-eps">
      <div class="eps-head"><h2>Episódios</h2><select id="mSeason"></select></div>
      <div class="eps" id="mEps"></div>
    </div>
  </div>
</div>

<script src="app.js?v=202611021749"></script>
</body>
</html>
